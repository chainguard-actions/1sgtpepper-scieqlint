name: Test basic usage - valid equations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run SciEqLint on valid equations
        id: action
        uses: .
        with:
          python-version: "3.11"
          package-version: "1.1.0"
          args: "check ${{ github.workspace }}/tests/fixtures/valid/algebra_valid.md"
      - name: Assert action succeeded
        run: |
          echo "PASS: scieqlint ran successfully on valid equations"
