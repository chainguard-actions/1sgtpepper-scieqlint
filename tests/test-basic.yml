name: Test basic usage - valid equations
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory with valid markdown
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-docs"
          cat > "$GITHUB_WORKSPACE/test-docs/valid.md" << 'EOF'
          # Valid equations

          $$
          (a+b)^2 = a^2 + 2*a*b + b^2
          $$
          EOF

      - name: Create scieqlint config pointing to test directory
        run: |
          cat > "$GITHUB_WORKSPACE/scieqlint-test.toml" << 'EOF'
          [project]
          root = "."
          order = []

          [scanner]
          markdown = true
          inline_math = false
          math_fences = true

          [parser]
          strict_unknowns = false
          unknown_identifier_policy = "single_symbol"

          [checks.algebra]
          enabled = true
          unknown = "info"
          denominator_warnings = true

          [checks.references]
          enabled = true
          missing = "warn"
          duplicate_labels = "error"
          missing_label_strict = false

          [checks.dimension]
          mode = "auto"
          unknown_variables = "warn"

          [checks.symbols]
          enabled = false
          EOF

      - id: action
        uses: .
        with:
          python-version: "3.11"
          package-version: "1.1.0"
          args: "check test-docs --config scieqlint-test.toml"

      - name: Assert action succeeded
        run: |
          echo "PASS: scieqlint ran successfully on valid equations"
