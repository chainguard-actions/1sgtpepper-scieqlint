name: Test custom args - version flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run SciEqLint with version flag
        id: action
        uses: .
        with:
          python-version: "3.11"
          package-version: "1.1.0"
          args: "--version"
      - name: Assert version output succeeded
        run: |
          echo "PASS: scieqlint --version ran successfully"
