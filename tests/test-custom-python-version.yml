name: Test custom Python version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run SciEqLint with Python 3.12
        id: action
        uses: .
        with:
          python-version: "3.12"
          package-version: "1.1.0"
          args: "check ${{ github.workspace }}/tests/fixtures/valid/algebra_valid.md"
      - name: Assert action succeeded with Python 3.12
        run: |
          echo "PASS: scieqlint ran successfully with Python 3.12"
