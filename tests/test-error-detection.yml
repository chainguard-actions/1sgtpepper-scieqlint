name: Test error detection - invalid equations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run SciEqLint on invalid equations
        id: action
        uses: .
        continue-on-error: true
        with:
          python-version: "3.11"
          package-version: "1.1.0"
          args: "check ${{ github.workspace }}/tests/fixtures/invalid/algebra_invalid.md"
      - name: Assert action detected errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: scieqlint correctly detected invalid equations and exited non-zero"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: scieqlint should have failed on invalid equations but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
