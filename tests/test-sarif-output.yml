name: Test SARIF output file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove stale output
        run: rm -f "$RUNNER_TEMP/scieqlint.sarif"
      - id: action
        uses: .
        continue-on-error: true
        with:
          # The default 1.2.1 is not published on PyPI; use the latest published release.
          package-version: "1.1.0"
          args: check tests/fixtures/bad/famous_bad.md --format sarif --output ${{ runner.temp }}/scieqlint.sarif
      - name: Assert SARIF file written with findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome (findings present)"
            exit 1
          fi
          F="$RUNNER_TEMP/scieqlint.sarif"
          if [ ! -s "$F" ]; then
            echo "FAIL: SARIF file missing or empty"
            exit 1
          fi
          cat "$F"
          python -m json.tool "$F" > /dev/null || { echo "FAIL: invalid JSON"; exit 1; }
          if ! grep -q "ALG001" "$F"; then
            echo "FAIL: expected ALG001 in SARIF"
            exit 1
          fi
          echo "PASS"
