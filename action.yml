name: SciEqLint
description: Run SciEqLint from GitHub Actions.

inputs:
  python-version:
    description: Python version used to install and run SciEqLint.
    required: false
    default: "3.11"
  package-version:
    description: SciEqLint package version to install from PyPI.
    required: false
    default: "1.2.1"
  args:
    description: Arguments passed to the scieqlint CLI.
    required: false
    default: "check ."

runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Set up Python
      uses: chainguard-actions/actions-setup-python@54626a9f20a67b48c7f84a1362272e3a2e22000c # v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install SciEqLint
      shell: bash
      env:
        PACKAGE_VERSION: ${{ inputs.package-version }}
      run: python -m pip install "scieqlint==${PACKAGE_VERSION}"
    - name: Run SciEqLint
      shell: bash
      env:
        INPUT_ARGS: ${{ inputs.args }}
      run: |
        args=()
        if [ -n "$INPUT_ARGS" ]; then
          printf '%s' "$INPUT_ARGS" | xargs -r true >/dev/null
          while IFS= read -r -d '' t; do args+=("$t"); done \
            < <(printf '%s' "$INPUT_ARGS" | xargs -r sh -c 'printf "%s\0" "$@"' sh)
        fi
        scieqlint "${args[@]}"
